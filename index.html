<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bocatto Brunch | Gracias por todo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');

        :root {
            --bg: #f9f8f6;
            --dark: #3b2f2f;
            --text-light: #7a6c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- NAVEGACIÓN SIMPLIFICADA --- */
        .main-nav {
            padding: 30px 0;
            background-color: var(--bg);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            text-decoration: none;
            color: var(--dark);
        }

        /* --- SECCIÓN DE DESPEDIDA --- */
        .closure-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 25px;
            max-width: 700px;
            margin: 0 auto;
        }

        /* --- ANIMACIÓN DEL CORAZÓN --- */
        .closure-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.2); }
            30% { transform: scale(1); }
            45% { transform: scale(1.2); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .closure-title {
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1.5px;
            margin-bottom: 20px;
            color: var(--dark);
        }

        .closure-text {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-light);
            margin-bottom: 40px;
        }

        /* --- FOOTER SIMPLIFICADO --- */
        .footer-simple {
            padding: 40px 30px;
            text-align: center;
        }

        .legal-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b5ada5;
            max-width: 1200px;
            margin: 0 auto;
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 30px;
        }
    </style>
</head>
<body>

    <nav class="main-nav">
        <div class="nav-container">
            <div class="nav-logo">Bocatto.</div>
        </div>
    </nav>

    <main class="closure-section">
        <div class="closure-icon">🤍</div>
        <h1 class="closure-title">Gracias por todo.</h1>
        <p class="closure-text">
            Bocatto Brunch ha cerrado sus puertas de forma definitiva. 
            <br><br>
            Queremos agradecer de corazón a cada una de las personas que nos acompañó, disfrutó de nuestros desayunos y formó parte de este proyecto. Fue un placer cocinar para ustedes.
        </p>
    </main>

    <footer class="footer-simple">
        <div class="legal-bar">
            <div>© 2024-2026 Bocatto Brunch</div>
        </div>
    </footer>

</body>
</html>
