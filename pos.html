<!DOCTYPE html>
<html lang="es">
<head>
    <meta http-equiv="refresh" content="0; url=index.html">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="robots">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Bocatto Brunch</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');

        :root {
            --bg: #f9f8f6;
            --accent: #1b2a8d;
            --dark: #3b2f2f;
            --text-light: #7a6c5d;
            --white: #ffffff;
            --danger: #d9534f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--dark);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .app-container { 
            width: 100%;
            max-width: 500px; 
            background: var(--white); 
            padding: 40px 30px; 
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.03);
        }

        .brand-header { text-align: center; margin-bottom: 30px; }

        .nav-logo {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            color: var(--dark);
            text-decoration: none;
            display: block;
        }

        .tagline {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 5px;
            display: block;
        }

        .form-group { margin-bottom: 20px; }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        /* Buscador nativo y campos */
        input, select { 
            width: 100%; 
            padding: 15px; 
            border: 1px solid rgba(0,0,0,0.1); 
            border-radius: 4px; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--dark);
            background-color: var(--bg);
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background-color: var(--white);
        }

        .row { display: flex; gap: 15px; }
        .row .form-group:first-child { flex: 2; }
        .row .form-group:last-child { flex: 1; }
        .row-half .form-group { flex: 1; }

        .btn-main {
            display: inline-block;
            width: 100%;
            padding: 20px 0;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 2px;
            transition: 0.3s ease;
            text-align: center;
            background: var(--dark); 
            color: var(--white); 
            border: 1px solid var(--dark);
            cursor: pointer;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .btn-main:hover { 
            background: var(--accent); 
            border-color: var(--accent); 
            transform: translateY(-3px); 
        }

        .btn-outline {
            background: transparent; 
            color: var(--dark); 
            border: 1px solid rgba(0,0,0,0.1);
        }

        .btn-outline:hover {
            background: var(--bg);
            border-color: var(--dark);
            transform: translateY(-2px);
            color: var(--dark);
        }

        .btn-danger-outline {
            background: transparent;
            color: var(--danger);
            border: 1px solid rgba(217, 83, 79, 0.3);
            margin-top: 10px;
        }

        .btn-danger-outline:hover {
            background: rgba(217, 83, 79, 0.05);
            border-color: var(--danger);
            transform: translateY(-2px);
        }

        hr {
            border: none;
            border-top: 1px solid rgba(0,0,0,0.05);
            margin: 30px 0;
        }

        /* TICKET VISUAL */
        .ticket-wrapper {
            background-color: var(--bg);
            padding: 20px;
            border-radius: 4px;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        #ticket-visual { 
            width: 100%;
            max-width: 320px;
            background: var(--white); 
            padding: 30px 20px; 
            color: var(--dark); 
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }

        .ticket-header { text-align: center; margin-bottom: 15px; }
        .ticket-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -1px; margin: 0; color: var(--dark); }
        .ticket-fecha { font-size: 12px; margin-top: 8px; color: var(--text-light); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 500; }
        .ticket-origen { font-size: 13px; font-weight: 800; font-family: 'Plus Jakarta Sans', sans-serif; margin-bottom: 10px; text-transform: uppercase; color: var(--accent); }
        .ticket-cliente { font-size: 12px; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--dark); margin-bottom: 12px; line-height: 1.4; }
        .ticket-divider { border-top: 1px dashed rgba(0,0,0,0.2); margin: 12px 0; }
        
        .item-container { margin: 8px 0; display: flex; flex-direction: column; }
        .item-row { display: flex; justify-content: space-between; font-size: 13px; line-height: 1.4; font-weight: bold; }
        .item-nota { font-size: 10px; color: var(--text-light); font-family: 'Plus Jakarta Sans', sans-serif; margin-top: 2px; line-height: 1.2; font-weight: 500;}

        .btn-eliminar {
            color: #d9534f;
            cursor: pointer;
            margin-left: 10px;
            font-weight: bold;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
        }

        .total-row { margin-top: 5px; font-weight: bold; font-size: 13px;}
        
        .ticket-footer { text-align: center; margin-top: 20px; }
        .ticket-footer p { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="brand-header">
        <div class="nav-logo">Bocatto<span>.</span></div>
        <span class="tagline">Punto de Venta</span>
    </div>
    
    <div class="form-group">
        <label>Buscar / Seleccionar Platillo</label>
        <input list="menu-lista" id="producto" placeholder="Escribe para buscar... Ej. Nutella, Bagel">
        <datalist id="menu-lista">
            <option value="Cuernito + Limonada - $80"></option>
            <option value="Cuernito + Té Frío - $55"></option>
            <option value="Cuernito + Smoothie Picosito - $70"></option>
            <option value="Cuernito + Papas + Chipotle - $65"></option>
            <option value="Cuernito + Papas + Coca Cola - $77"></option>
            <option value="Cuernito Americano + Papas + Coca Cola - $85"></option>
            <option value="Cuernito Deluxe + Latte Frío - $85"></option>
            <option value="Hot Cakes + Latte Frío - $70"></option>
            <option value="Hot Cakes Nutella + Latte Frío - $85"></option>
            <option value="Desayuno Americano + Café - $85"></option>
            <option value="Omelette + Café - $90"></option>
            <option value="Club Sandwich + Nutella Latte - $99"></option>
            
            <option value="Cuernito Huevo, Jamón y Queso - $45"></option>
            <option value="Cuernito Clásico (Jamón y Queso) - $35"></option>
            <option value="Cuernito Americano - $55"></option>
            <option value="Cuernito Deluxe - $60"></option>
            <option value="Bagel Tocino - $65"></option>
            <option value="Bagel Huevo - $60"></option>
            <option value="Club Sandwich con Papas - $60"></option>
            
            <option value="Hot Cakes: Jamón, Queso Philadelphia y Tocino - $120"></option>
            <option value="Hot Cakes: Rellenos de Jamón y Queso - $80"></option>
            <option value="Hot Cakes: Con Tocino y Maple - $60"></option>
            <option value="Hot Cakes: Rellenos de Nutella - $52"></option>
            <option value="Hot Cakes: Clásicos (Maple/Mermelada) - $35"></option>
            
            <option value="Omelette Tocino y Manchego - $70"></option>
            <option value="Huevo con Tocino - $80"></option>
            <option value="Omelette de Tres Quesos - $70"></option>
            <option value="Omelette Jamón, Tocino y Queso - $75"></option>
            <option value="Omelette Jamón y Queso - $50"></option>
            <option value="Omelette con Verduras, Jamón y Queso - $70"></option>
            <option value="Omelette Vegetariano - $50"></option>
            <option value="Huevos con Jamón - $60"></option>
            
            <option value="Extra: Frijoles Refritos con Queso - $10"></option>
            <option value="Extra: Micha Fileteada - $6"></option>
            <option value="Extra: Huevo (1 pza) - $9"></option>
            <option value="Extra: Tocino (4 pzas) - $25"></option>
            <option value="Extra: Jamón (2 pzas) - $15"></option>
            <option value="Extra: Aderezo Chipotle Dulce - $10"></option>
            <option value="Extra: Cambiar a Bagel - $10"></option>
            <option value="Extra: Papas Chips - $20"></option>

            <option value="Caliente: Nutella Latte - $60"></option>
            <option value="Caliente: Chocolate Mexicano - $50"></option>
            <option value="Caliente: Vainilla Latte - $45"></option>
            <option value="Caliente: Latte Clásico - $43"></option>
            <option value="Caliente: Café Americano - $35"></option>

            <option value="Frío: Nutella Latte - $60"></option>
            <option value="Frío: Malteada (Fresa/Choc/Vainilla) - $60"></option>
            <option value="Frío: Latte con Helado - $56"></option>
            <option value="Frío: Limonada Frutos Rojos - $55"></option>
            <option value="Frío: Chocolate Mexicano - $50"></option>
            <option value="Frío: Fresa Latte - $50"></option>
            <option value="Frío: Vainilla Latte - $45"></option>
            <option value="Frío: Latte Clásico - $43"></option>
            <option value="Frío: Café Americano - $40"></option>
            <option value="Frío: Smoothie Picosito - $35"></option>
            <option value="Frío: Té Frío - $20"></option>
            <option value="Frío: Leche de Almendras - $7"></option>
            
            <option value="Coca Cola 600ml - $25"></option>
            <option value="Naranjada Mineral 600ml - $20"></option>
            <option value="Coca Cola 350 ml - $19"></option>
            <option value="Agua 1L - $10"></option>
        </datalist>
    </div>

    <div class="row">
        <div class="form-group" style="flex: 3;">
            <label>Notas / Comentarios al platillo (Opcional)</label>
            <input type="text" id="nota_platillo" placeholder="Ej. Sin cebolla, extra aderezo...">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>Cant.</label>
            <input type="number" id="cantidad" value="1" min="1">
        </div>
    </div>
    
    <button class="btn-main btn-outline" onclick="agregarAlPedido()">+ Agregar a la orden</button>

    <hr>
    
    <div class="form-group">
        <label>Nombre del Cliente</label>
        <input type="text" id="nombre_cliente" placeholder="Ej. Ana Valeria" oninput="actualizarTicket()">
    </div>

    <div class="row row-half">
        <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="telefono_cliente" placeholder="Ej. 229..." oninput="actualizarTicket()">
        </div>
        <div class="form-group">
            <label>Costo de Envío ($)</label>
            <input type="number" id="envio" value="0" min="0" oninput="actualizarTicket()">
        </div>
    </div>
    
    <div class="form-group" style="margin-bottom: 5px;">
        <label>Dirección de Envío</label>
    </div>
    <div class="row row-half">
        <div class="form-group">
            <input type="text" id="dir_calle" placeholder="Calle (Ej. Reforma)" oninput="actualizarTicket()">
        </div>
        <div class="form-group">
            <input type="text" id="dir_ext" placeholder="Núm Ext." oninput="actualizarTicket()">
        </div>
        <div class="form-group">
            <input type="text" id="dir_int" placeholder="Núm Int." oninput="actualizarTicket()">
        </div>
    </div>
    <div class="row row-half">
        <div class="form-group">
            <input type="text" id="dir_col" placeholder="Colonia / Fracc." oninput="actualizarTicket()">
        </div>
        <div class="form-group">
            <input type="text" id="dir_cp" placeholder="C.P." oninput="actualizarTicket()">
        </div>
    </div>
    <div class="form-group">
        <input type="text" id="dir_ref" placeholder="Referencias (Ej. Portón blanco...)" oninput="actualizarTicket()">
    </div>

    <div class="row row-half" style="margin-top: 15px;">
        <div class="form-group">
            <label>Método de Pago</label>
            <select id="metodo_pago" onchange="verificarPago(); actualizarTicket()">
                <option value="Efectivo">Efectivo</option>
                <option value="Transferencia">Transferencia</option>
            </select>
        </div>
        <div class="form-group" id="grupo_estado_pago" style="display: none;">
            <label>Estado de Pago</label>
            <select id="estado_pago" onchange="actualizarTicket()">
                <option value="No Pagado">No Pagado</option>
                <option value="Pagado">Pagado</option>
            </select>
        </div>
    </div>
    
    <div class="form-group">
        <label>Plataforma / Origen del Pedido</label>
        <select id="origen_pedido" onchange="actualizarTicket()">
            <option value="Local / WhatsApp">Local / WhatsApp (Directo)</option>
            <option value="Rappi">Rappi</option>
            <option value="Uber Eats">Uber Eats</option>
            <option value="Didi Food">Didi Food</option>
        </select>
    </div>

    <div class="ticket-wrapper">
        <div id="ticket-visual">
            <div class="ticket-header">
                <p class="ticket-title">Bocatto.</p>
                <div class="ticket-fecha">
                    <strong>Folio: #<span id="t-folio"></span></strong><br>
                    <span id="t-fecha"></span>
                </div>
            </div>
            
            <div id="t-origen" class="ticket-origen"></div>

            <div id="t-cliente-info" class="ticket-cliente"></div>
            
            <div class="ticket-divider"></div>
            
            <div id="lista-items"></div>
            
            <div class="ticket-divider"></div>
            
            <div class="total-row">
                <div class="item-row"><span>Subtotal</span> <span id="t-subtotal">$0.00</span></div>
                <div class="item-row"><span>Envío</span> <span id="t-envio">$0.00</span></div>
                <div class="item-row" style="font-size: 16px; margin-top: 10px; color: var(--accent);">
                    <span>TOTAL</span> <span id="t-total">$0.00</span>
                </div>
            </div>
            
            <p id="t-direccion" style="font-size: 11px; margin-top: 15px; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-light); line-height: 1.4;"></p>
            
            <p id="t-pago" style="font-size: 12px; margin-top: 10px; font-family: 'Plus Jakarta Sans', sans-serif; color: var(--dark); line-height: 1.4; font-weight: 800;"></p>

            <div class="ticket-divider"></div>
            
            <div class="ticket-footer">
                <p style="margin: 0; font-size: 14px; color: var(--dark); font-weight: 800;">¡Gracias por tu pedido!</p>
                <p style="margin: 10px 0; font-size: 10px; color: var(--text-light); line-height: 1.4;">Todo en Bocatto Brunch se prepara al momento para que llegue calientito y delicioso a tu puerta. Gracias por tu paciencia y por apoyar lo local.</p>
                <p style="margin: 10px 0 0 0; font-weight: 800; font-size: 12px; color: var(--accent);">www.bocattobrunch.com</p>
            </div>
        </div>
    </div>

    <button class="btn-main" onclick="descargarTicket()" style="margin-top: 20px;">Generar Ticket Final</button>
    
    <button class="btn-main btn-danger-outline" onclick="limpiarTicket()">Limpiar Ticket / Nuevo Pedido</button>
</div>

<script>
    let pedido = [];
    
    // SISTEMA DE FOLIO CON MEMORIA LOCAL
    let folioActual = parseInt(localStorage.getItem('bocatto_folio')) || 1;

    function formatoFolio(num) {
        return num.toString().padStart(4, '0');
    }

    function obtenerFechaActual() {
        const opciones = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        return new Date().toLocaleDateString('es-MX', opciones);
    }

    // Fecha para nombre de archivo (Formato: DD-MM-YYYY_HH-MM)
    function obtenerFechaArchivo() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        return `${day}-${month}-${year}_${hours}-${minutes}-${seconds}`;
    }

    function verificarPago() {
        const metodo = document.getElementById('metodo_pago').value;
        const grupoEstado = document.getElementById('grupo_estado_pago');
        if (metodo === 'Transferencia') {
            grupoEstado.style.display = 'block';
        } else {
            grupoEstado.style.display = 'none';
        }
    }

    function agregarAlPedido() {
        const inputStr = document.getElementById('producto').value;
        
        if(!inputStr.includes(" - $")) {
            alert("Por favor, selecciona un producto válido de la lista desplegable.");
            return;
        }

        const partes = inputStr.split(' - $');
        const nombre = partes[0];
        const precio = parseFloat(partes[1]);
        const cant = parseInt(document.getElementById('cantidad').value) || 1;
        const nota = document.getElementById('nota_platillo').value.trim();

        pedido.push({ nombre, precio, cant, nota });
        
        document.getElementById('producto').value = '';
        document.getElementById('cantidad').value = 1;
        document.getElementById('nota_platillo').value = '';

        actualizarTicket();
    }

    function eliminarDelPedido(index) {
        pedido.splice(index, 1);
        actualizarTicket();
    }

    function limpiarTicket() {
        if(confirm("¿Estás seguro de borrar todo y empezar un ticket nuevo? (Esto avanzará el número de Folio al siguiente)")) {
            // Avanzar Folio
            folioActual++;
            localStorage.setItem('bocatto_folio', folioActual);

            // Limpiar datos
            pedido = [];
            document.getElementById('producto').value = '';
            document.getElementById('cantidad').value = 1;
            document.getElementById('nota_platillo').value = '';
            document.getElementById('nombre_cliente').value = '';
            document.getElementById('telefono_cliente').value = '';
            document.getElementById('envio').value = 0;
            
            document.getElementById('dir_calle').value = '';
            document.getElementById('dir_ext').value = '';
            document.getElementById('dir_int').value = '';
            document.getElementById('dir_col').value = '';
            document.getElementById('dir_cp').value = '';
            document.getElementById('dir_ref').value = '';

            document.getElementById('metodo_pago').value = 'Efectivo';
            document.getElementById('estado_pago').value = 'No Pagado';
            document.getElementById('origen_pedido').value = 'Local / WhatsApp';
            
            verificarPago();
            actualizarTicket();
        }
    }

    function actualizarTicket() {
        const lista = document.getElementById('lista-items');
        const envio = parseFloat(document.getElementById('envio').value) || 0;
        
        const nombre = document.getElementById('nombre_cliente').value.trim();
        const telefono = document.getElementById('telefono_cliente').value.trim();
        
        const calle = document.getElementById('dir_calle').value.trim();
        const ext = document.getElementById('dir_ext').value.trim();
        const int = document.getElementById('dir_int').value.trim();
        const col = document.getElementById('dir_col').value.trim();
        const cp = document.getElementById('dir_cp').value.trim();
        const ref = document.getElementById('dir_ref').value.trim();

        let direccionLinea = "";
        if(calle) direccionLinea += calle;
        if(ext) direccionLinea += " #" + ext;
        if(int) direccionLinea += " Int. " + int;
        if(col) direccionLinea += ", Col. " + col;
        if(cp) direccionLinea += ", C.P. " + cp;
        if(ref) direccionLinea += " (Ref: " + ref + ")";
        
        // Actualizar Folio y Fecha
        document.getElementById('t-folio').innerText = formatoFolio(folioActual);
        document.getElementById('t-fecha').innerText = obtenerFechaActual();
        
        // Actualizar Origen (Delivery)
        const origen = document.getElementById('origen_pedido').value;
        const origenText = document.getElementById('t-origen');
        if(origen !== 'Local / WhatsApp') {
            origenText.innerHTML = `🛵 VÍA: ${origen}`;
            origenText.style.display = "block";
            origenText.style.textAlign = "center";
        } else {
            origenText.innerHTML = "";
            origenText.style.display = "none";
        }

        const clienteInfo = document.getElementById('t-cliente-info');
        let infoHTML = "";
        if (nombre) infoHTML += `<strong>Cliente:</strong> ${nombre}<br>`;
        if (telefono) infoHTML += `<strong>Tel:</strong> ${telefono}`;
        
        clienteInfo.innerHTML = infoHTML;
        clienteInfo.style.display = (infoHTML === "") ? "none" : "block";

        lista.innerHTML = "";
        let subtotal = 0;

        if(pedido.length === 0) {
            lista.innerHTML = "<p style='text-align:center; font-size:12px; color: var(--text-light); font-family: \"Plus Jakarta Sans\", sans-serif;'>El carrito está vacío</p>";
        }

        pedido.forEach((item, index) => {
            const totalItem = item.precio * item.cant;
            subtotal += totalItem;
            
            let htmlNota = item.nota ? `<div class="item-nota">» ${item.nota}</div>` : "";
            
            lista.innerHTML += `
                <div class="item-container">
                    <div class="item-row">
                        <span style="flex: 1; padding-right: 10px;">${item.cant}x ${item.nombre}</span>
                        <span>$${totalItem.toFixed(2)} <span class="btn-eliminar" onclick="eliminarDelPedido(${index})" title="Eliminar producto">X</span></span>
                    </div>
                    ${htmlNota}
                </div>`;
        });

        document.getElementById('t-subtotal').innerText = `$${subtotal.toFixed(2)}`;
        document.getElementById('t-envio').innerText = `$${envio.toFixed(2)}`;
        document.getElementById('t-total').innerText = `$${(subtotal + envio).toFixed(2)}`;
        
        const direccionText = document.getElementById('t-direccion');
        if (direccionLinea !== "") {
            direccionText.innerHTML = "<strong>DIRECCIÓN DE ENTREGA:</strong><br>" + direccionLinea;
        } else {
            direccionText.innerHTML = "";
        }

        const metodo = document.getElementById('metodo_pago').value;
        const estado = document.getElementById('estado_pago').value;
        let pagoText = `MÉTODO DE PAGO: ${metodo}`;
        
        if(metodo === 'Transferencia') {
            let colorEstado = estado === 'Pagado' ? '#28a745' : '#d9534f'; 
            pagoText += ` - <span style="color:${colorEstado};">${estado}</span>`;
        }
        
        document.getElementById('t-pago').innerHTML = pagoText;
    }

    function descargarTicket() {
        // Asegurarnos de que el folio actual se guarda (por si es la primera vez que se usa la app en este navegador)
        localStorage.setItem('bocatto_folio', folioActual);
        
        document.getElementById('t-fecha').innerText = obtenerFechaActual();
        
        const botonesEliminar = document.querySelectorAll('.btn-eliminar');
        botonesEliminar.forEach(btn => btn.style.display = 'none');

        const ticket = document.getElementById('ticket-visual');
        html2canvas(ticket, { 
            scale: 2,
            backgroundColor: "#ffffff"
        }).then(canvas => {
            const link = document.createElement('a');
            
            // NOMBRE DEL ARCHIVO CON FOLIO, FECHA Y HORA
            const nombreArchivo = `Folio_${formatoFolio(folioActual)}_${obtenerFechaArchivo()}.png`;
            link.download = nombreArchivo;
            
            link.href = canvas.toDataURL('image/png');
            link.click();

            botonesEliminar.forEach(btn => btn.style.display = 'inline');
        });
    }

    verificarPago();
    actualizarTicket();
</script>

</body>
</html>
