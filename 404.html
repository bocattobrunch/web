<!DOCTYPE html>
<html lang="es">
<head>
<meta name="robots">
<link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Bocatto Brunch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;500;800&display=swap');

        :root {
            --bg: #f9f8f6;
            --accent: #1b2a8d;
            --dark: #3b2f2f;
            --text-light: #7a6c5d;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--dark); line-height: 1.6; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100vh; }

        /* --- BARRA DE NAVEGACIÓN (ORIGINAL DEL INDEX) --- */
        .main-nav {
            padding: 30px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            background-color: var(--bg);
            position: relative;
            z-index: 100;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            text-decoration: none;
            color: var(--dark);
        }

        .nav-logo span { color: var(--dark); }

        .nav-links {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--dark);
            opacity: 0.6;
            transition: 0.3s;
            position: relative;
            padding-bottom: 4px;
        }

        .nav-links a:hover { opacity: 1; }
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0; left: 0;
            background-color: var(--accent);
            transition: 0.3s;
        }
        .nav-links a:hover::after { width: 100%; }

        /* AJUSTES PARA MÓVIL EN LA NAVEGACIÓN (ORIGINAL DEL INDEX ACTUALIZADO) */
        @media (max-width: 768px) {
            .nav-container { 
                flex-direction: column; 
                gap: 25px; 
            }
            .nav-links { 
                gap: 20px; 
                width: 100%;
                justify-content: center;
            }
            .nav-links a { 
                font-size: 0.75rem; 
            }
        }

        /* --- SECCIÓN 404 (INTACTA) --- */
        .error-section {
            flex: 1; /* Esto empuja el footer hacia abajo si hay poco contenido */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 25px;
        }

        .error-code {
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            letter-spacing: -5px;
            margin-bottom: 20px;
        }

        .error-message {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-light);
            max-width: 500px;
            margin-bottom: 40px;
        }

        .btn-return {
            display: inline-block;
            background: var(--dark);
            color: var(--white);
            padding: 20px 40px;
            text-decoration: none;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            border-radius: 4px;
            transition: 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .btn-return:hover {
            background: var(--accent);
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(27, 42, 141, 0.15);
        }

        /* --- FOOTER UNIFICADO (ORIGINAL DEL INDEX) --- */
        .footer-main { padding-top: 60px; border-top: 1px solid rgba(0,0,0,0.05); display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 40px; max-width: 1200px; margin: 0 auto; padding: 60px 30px; }
        
        @media (max-width: 850px) { 
            .footer-main { grid-template-columns: 1fr; text-align: center; } 
        }
        
        .brand-name { font-size: 2.5rem; font-weight: 800; letter-spacing: -2px; margin-bottom: 10px; }
        .footer-col h4 { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 20px; font-weight: 800; }
        .footer-col a { display: block; text-decoration: none; color: var(--dark); font-size: 0.85rem; margin-bottom: 10px; font-weight: 500; transition: 0.2s; }
        .footer-col a:hover { color: var(--accent); }

        .legal-bar { margin-top: 80px; padding-top: 30px; border-top: 1px solid rgba(0,0,0,0.05); display: flex; justify-content: space-between; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #b5ada5; max-width: 1200px; margin: 0 auto; padding: 30px 30px 60px 30px; }
        .legal-bar a { text-decoration: none; color: inherit; transition: 0.2s; }
        .legal-bar a:hover { color: var(--accent); }

        @media (max-width: 768px) {
            .legal-bar { flex-direction: column; align-items: center; gap: 15px; }
        }
    </style>
</head>
<body>

    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Bocatto<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="menu.html">Menú</a></li>
                <li><a href="promociones.html">Promociones</a></li>
            </ul>
        </div>
    </nav>

    <main class="error-section">
        <h1 class="error-code">404</h1>
        <p class="error-message">¡Ups! Parece que esta orden de brunch se perdió en el camino.</p>
        <a href="index.html" class="btn-return">Regresar al inicio</a>
    </main>

    <footer class="footer-main">
        <div class="brand-info">
            <div class="brand-name">Bocatto.</div>
            <a href="mailto:contacto@bocattobrunch.com" style="text-decoration: none; color: var(--text-light); font-size: 0.85rem;">contacto@bocattobrunch.com</a>
        </div>
        <div class="footer-col">
            <h4>Atención</h4>
            <a href="https://wa.me/522295190082" target="_blank">WhatsApp</a>
            <a href="menu.html">Menú</a>
            <a href="promociones.html">Promociones</a>
        </div>
        <div class="footer-col">
            <h4>Nuestra Marca</h4>
            <a href="https://facebook.com/bocattobrunch" target="_blank">Facebook</a>
            <a href="https://instagram.com/bocattobrunch" target="_blank">Instagram</a>
        </div>
    </footer>

    <div class="legal-bar">
        <div>© 2024-2026 Bocatto Brunch</div>
        <div>Diseñado por <a href="https://www.harbor48.studio" target="_blank" style="text-decoration: none; color: inherit;">harbor48</a></div>
    </div>

</body>
</html>
